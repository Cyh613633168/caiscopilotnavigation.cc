<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小蔡同学 - 链接</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/nav.css">
</head>
<body>
    <div class="container">
        <h2>小蔡同学</h2>
        <p>这里单独放“小蔡同学”这个分类下的链接。</p>
        <p>栏目链接数量：<span id="link-count">0</span></p>
        <p><a href="../index.html">返回首页</a></p>
        <div class="row" id="links-list">
            <div class="col-sm-6 link-item">
                <div class="xe-widget xe-conversations box2 label-info">
                    <div class="xe-comment-entry">
                            <!-- 静态测试图标（调试用） -->
                            <img src="https://www.google.com/s2/favicons?sz=64&domain=github.com" class="link-icon" alt="github-icon">
                            <div class="xe-comment">
                                <a href="https://github.com" target="_blank" class="xe-user-name overflowClip_1"><strong>GitHub</strong></a>
                                <p class="overflowClip_2">代码托管与协作平台 — GitHub。</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 link-item">
                    <div class="xe-widget xe-conversations box2 label-info">
                        <div class="xe-comment-entry">
                            <div class="xe-comment">
                                <a href="https://scholar.google.com/" target="_blank" class="xe-user-name overflowClip_1"><strong>Google Scholar</strong></a>
                                <p class="overflowClip_2">学术搜索引擎 — Google Scholar。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                var count = document.querySelectorAll('#links-list .link-item').length;
                document.getElementById('link-count').textContent = count;
            });
        </script>
    </div>
    <script>
        // 将 favicon 插入到 .xe-comment-entry 内，配合现有 .xe-comment-entry img 浮动样式
        document.addEventListener('DOMContentLoaded', function(){
            document.querySelectorAll('#links-list .xe-user-name').forEach(function(a){
                var href = a.getAttribute('href');
                if(!href || href === '#') return;
                try {
                    var host = new URL(href, location.href).hostname;
                    var img = document.createElement('img');
                    img.className = 'link-icon';
                    img.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + host;
                    img.onerror = function() {
                        this.onerror = null;
                        this.src = '../assets/images/favicon.png';
                    };
                    var entry = a.closest('.xe-comment-entry');
                    if(entry) entry.insertBefore(img, entry.firstChild);
                } catch(e){}
            });
        });
    </script>
</body>
</html>
