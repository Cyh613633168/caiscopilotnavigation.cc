<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小卢同学 - 链接</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/nav.css">
</head>
<body>
    <div class="container">
        <h2>小卢同学</h2>
        <p>这里单独放“小卢同学”这个分类下的链接。</p>
        <p>栏目链接数量：<span id="link-count">0</span></p>
        <p><a href="../index.html">返回首页</a></p>
        <div class="row" id="links-list">
            <div class="col-sm-6 link-item">
                <div class="xe-widget xe-conversations box2 label-info">
                    <div class="xe-comment-entry">
                        <img class="link-icon" src="../assets/images/favicon.png" data-src="https://t3.gstatic.cn/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&size=128&url=https://www.baidu.com/" onerror="this.onerror=null;this.src='../assets/images/favicon.png';" alt="Baidu">
                        <div class="xe-comment">
                            <a href="https://www.baidu.com/" target="_blank" class="xe-user-name overflowClip_1"><strong>百度</strong></a>
                            <p class="overflowClip_2">中文搜索引擎，快速查找学习资料与网站。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                var count = document.querySelectorAll('#links-list .link-item').length;
                document.getElementById('link-count').textContent = count;
            });
        </script>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            document.querySelectorAll('#links-list img.link-icon[data-src]').forEach(function(img){
                img.src = img.getAttribute('data-src');
            });
        });
    </script>
</body>
</html>
