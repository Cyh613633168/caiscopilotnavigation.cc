    <script type="text/javascript">
    $(document).ready(function() {
         //img lazy loaded
         const observer = lozad();
         observer.observe();
         document.querySelectorAll('img.lazy[data-src]').forEach(function(img){
             img.src = img.getAttribute('data-src');
         });

        $(document).on('click', '.has-sub', function(){
            var _this = $(this)
            if(!$(this).hasClass('expanded')) {
               setTimeout(function(){
                    _this.find('ul').attr("style","")
               }, 300);
              
            } else {
                $('.has-sub ul').each(function(id,ele){
                    var _that = $(this)
                    if(_this.find('ul')[0] != ele) {
                        setTimeout(function(){
                            _that.attr("style","")
                        }, 300);
                    }
                })
            }
        })
        $('#search-btn').click(function(){
            var input = document.getElementById('search-input');
            var query = input.value.trim();
            if(!query) return;
            var engine = document.querySelector('.search-tab.active').getAttribute('data-engine');
            var url;
            switch(engine){
                case 'google': url = 'https://www.google.com/search?q=' + encodeURIComponent(query); break;
                case 'site': url = 'https://www.baidu.com/s?wd=' + encodeURIComponent('site:' + location.host + ' ' + query); break;
                case 'taobao': url = 'https://s.taobao.com/search?q=' + encodeURIComponent(query); break;
                case 'bing': url = 'https://cn.bing.com/search?q=' + encodeURIComponent(query); break;
                default: url = 'https://www.baidu.com/s?wd=' + encodeURIComponent(query); break;
            }
            window.open(url, '_blank');
        });
        $('.search-tab').click(function(e){
            e.preventDefault();
            $('.search-tab').removeClass('active');
            $(this).addClass('active');
            var placeholder = $(this).attr('data-placeholder');
            $('#search-input').attr('placeholder', placeholder);
        });
        $('.user-info-menu .hidden-sm').click(function(){
            if($('.sidebar-menu').hasClass('collapsed')) {
                $('.has-sub.expanded > ul').attr("style","")
            } else {
                $('.has-sub.expanded > ul').show()
            }
        })
        $("#main-menu li ul li").click(function() {
            $(this).siblings('li').removeClass('active'); // 删除其他兄弟元素的样式
            $(this).addClass('active'); // 添加当前元素的样式
        });
        $("a.smooth").click(function(ev) {
            ev.preventDefault();

            public_vars.$mainMenu.add(public_vars.$sidebarProfile).toggleClass('mobile-is-visible');
            ps_destroy();
            $("html, body").animate({
                scrollTop: $($(this).attr("href")).offset().top - 30
            }, {
                duration: 500,
                easing: "swing"
            });
        });
        return false;
    });

    var href = "";
    var pos = 0;
    $("a.smooth").click(function(e) {
        $("#main-menu li").each(function() {
            $(this).removeClass("active");
        });
        $(this).parent("li").addClass("active");
        e.preventDefault();
        href = $(this).attr("href");
        pos = $(href).position().top - 30;
    });
    </script>
